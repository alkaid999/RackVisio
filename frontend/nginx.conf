server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 历史路由（HTML5 history 模式）刷新子路由不 404
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源安全响应头（F-01）：CSP / 点击劫持 / MIME 嗅探 / Referrer。
        # 注意：/api/ 的反代响应由后端 SecurityHeadersMiddleware 注入安全头，
        # 此处仅作用于静态资源，避免两个 CSP 头叠加（多 CSP 头浏览器取交集会误伤）。
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # style-src 保留 'unsafe-inline'：Vue 动态 style 绑定/静态 style 属性；
        # img-src data:/blob:、worker-src blob:：Three.js 纹理/渲染资源；
        # frame-ancestors 'none'：禁止 iframe 嵌入（点击劫持防护）。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # 反向代理 API 到后端服务
    # 前端请求使用相对路径 /api/v1/* ，由 Nginx 转发至 compose 内网服务名 backend:8000
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
